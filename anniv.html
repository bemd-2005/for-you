};

(function(){const s=q('#bunt'),w=innerWidth,n=Math.ceil(w/44),c=['#ff4d6d','#e8c39e','#f08aa3','#fff0f3','#c9a876'];let h='<path d="M0 6 Q'+w/2+' 34 '+w+' 6" stroke="#e8c39e" fill="none" stroke-width="1.5"/>';for(let i=0;i<n;i++){const x=i*44+6,t=i/n,y=6+Math.sin(t*Math.PI)*14;h+='<polygon points="'+x+','+y+' '+(x+32)+','+y+' '+(x+16)+','+(y+34)+'" fill="'+c[i%5]+'"/>';}s.innerHTML=h;})();

// mélodie Happy Birthday (synthétisée, boîte à musique)
function melody(){const A=new(window.AudioContext||window.webkitAudioContext)(),F={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784},
 S=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];let t=A.currentTime+.1;const u=.42;

// cœur de mots
(function(){const cv=q('#hc'),c=cv.getContext('2d'),W=640,H=560,sc=Math.min(W,H)/2.6,W0=['Joyeux anniversaire',C.nom,'♥'].concat(age?[age+' ans']:[]),Ps=[];let n=0;
 while(Ps.length<150&&n++<20000){const x=Math.random()*2.6-1.3,y=Math.random()*2.4-1.2;if(Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0){const w=W0[Ps.length%W0.length],s=11+Math.random()*8,o=document.createElement('canvas');o.width=s*w.length*.65+40;o.height=s*2+40;const k=o.getContext('2d');k.font=s+'px Georgia';k.textAlign='center';k.textBaseline='middle';k.shadowColor='#ff4d6d';k.shadowBlur=14;k.fillStyle='#ff6b81';k.fillText(w,o.width/2,o.height/2);Ps.push({o:o,tx:W/2+x*sc,ty:H/2+40-y*sc,sx:Math.random()*W,sy:Math.random()*H,d:Math.random()*600,u:1500+Math.random()*900,ph:Math.random()*6,sp:.0016+Math.random()*.0012});}}
 let t0=0,on=0;function fr(now){if(!t0)t0=now;const t=now-t0;c.clearRect(0,0,W,H);Ps.forEach(p=>{const l=t-p.d;let x,y,a;if(l<=0){return}else if(l<p.u){const e=1-Math.pow(1-l/p.u,3);x=p.sx+(p.tx-p.sx)*e;y=p.sy+(p.ty-p.sy)*e;a=e}else{x=p.tx;y=p.ty;a=.6+.4*Math.sin(t*p.sp+p.ph)}c.globalAlpha=a;c.drawImage(p.o,x-p.o.width/2,y-p.o.height/2)});c.globalAlpha=1;requestAnimationFrame(fr)}

// bling : étincelles, feux d'artifice, options, tirage de vœu
let sk=true,ls=0;
function spark(x,y){if(!sk)return;const n=performance.now();if(n-ls<45)return;ls=n;const e=document.createElement('div');e.textContent=Math.random()<.5?'✦':'✧';e.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;z-index:70;pointer-events:none;color:'+['#ffd27a','#ff8fa3','#fff'][Math.random()*3|0]+';font-size:'+(10+Math.random()*12)+'px;animation:sp .9s ease-out forwards';document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
addEventListener('pointermove',e=>spark(e.clientX,e.clientY));
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)spark(t.clientX,t.clientY)},{passive:true});
q('#fwb').onclick=()=>{for(let i=0;i<6;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.35),90),i*380)};
q('#ob').onclick=()=>q('#opt').classList.toggle('show');
q('#o1').onchange=e=>document.body.classList.toggle('nb',!e.target.checked);
q('#o2').onchange=e=>{sk=e.target.checked};
q('#o3').onchange=e=>document.documentElement.style.setProperty('--r',e.target.checked?'#ffd27a':'#ff4d6d');
q('#dw').onclick=()=>{const v=C.voeux[Math.random()*C.voeux.length|0],d=q('#dc');d.style.display='block';d.textContent='« '+v.t+' »';d.style.animation='none';d.offsetHeight;d.style.animation='fi .8s';const r=d.getBoundingClientRect();burst(r.left+r.width/2,r.top,50)};
document.querySelectorAll('.card').forEach(c=>{c.classList.add('rv');io.observe(c)});
</script></body></html>
